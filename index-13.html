<style>
/* Layout: single phone column. Home = featured sushi tile + colour grid of 20 scenarios.
   Auction = two player panels, the item on the block, price stepper, assign/skip. Result = reveal + winner. */
:root{
  --bg:#0F2233; --surface:#18334A; --surface2:#21435F; --ink:#F4F7FA; --muted:#9FB6C8; --line:#2D5273;
  --accent:#FF5A5F; --on-accent:#1B0A0B;
  --p1:#4CC9F0; --on-p1:#06202E; --p2:#FFC043; --on-p2:#2B1D00;
  --good:#3DDC97; --bad:#FF7A7A; --tile-ink:#0B1A26;
  --font-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --font-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#EEF4F8; --surface:#FFFFFF; --surface2:#E1ECF4; --ink:#10283B; --muted:#51697C; --line:#C5D6E2;
    --accent:#E63946; --on-accent:#FFFFFF;
    --p1:#0B86B8; --on-p1:#FFFFFF; --p2:#F2A900; --on-p2:#2B1D00;
    --good:#119865; --bad:#D63B3B; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#EEF4F8; --surface:#FFFFFF; --surface2:#E1ECF4; --ink:#10283B; --muted:#51697C; --line:#C5D6E2;
  --accent:#E63946; --on-accent:#FFFFFF;
  --p1:#0B86B8; --on-p1:#FFFFFF; --p2:#F2A900; --on-p2:#2B1D00;
  --good:#119865; --bad:#D63B3B; color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.4;padding-inline:16px;padding-block:14px 40px}
#app{max-width:480px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* home */
.hero h1{font-size:40px;font-weight:800;line-height:1}
.hero p{margin:8px 0 0;color:var(--muted);max-width:34ch}
.rules{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface2);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:500}
.card{background:var(--surface);border-radius:18px;padding:14px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.names label{display:flex;flex-direction:column;gap:6px;min-width:0}
.names input{width:100%;min-width:0;background:var(--surface2);border:2px solid var(--line);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;font-weight:700}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.d0{background:var(--p1)}.d1{background:var(--p2)}
.night{display:flex;align-items:center;justify-content:space-between;gap:12px}
.score{font-family:var(--font-display);font-size:34px;font-weight:800;display:flex;gap:10px;align-items:baseline}
.score .a{color:var(--p1)}.score .b{color:var(--p2)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;text-align:left;border:0;border-radius:18px;padding:14px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;
  background:hsl(var(--h) 85% 62%);color:var(--tile-ink);transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile-name{font-family:var(--font-display);font-weight:800;font-size:19px;line-height:1.05;overflow-wrap:anywhere}
.tile-scen{font-size:12.5px;line-height:1.25;opacity:.85}
.tile-meta{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:700}
.tile.feat{grid-column:1/-1;min-height:150px;background:hsl(var(--h) 90% 64%)}
.tile.feat .tile-name{font-size:30px}
.tile.feat::after{content:"Si parte da qui";position:absolute;top:12px;right:12px;background:var(--tile-ink);color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:999px}
.win{display:inline-flex;align-items:center;gap:5px;background:var(--tile-ink);color:#fff;border-radius:999px;padding:3px 9px;font-size:11px}
.win i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* mystery + combos */
.tile.mys{grid-column:1/-1;min-height:130px;background:var(--surface2);color:var(--ink);border:2px dashed var(--accent)}
.tile.mys .tile-name{font-size:28px}
.shuf{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.shuf-name{font-family:var(--font-display);font-weight:800;font-size:40px;line-height:1.05;max-width:100%;overflow-wrap:anywhere;color:var(--accent)}
.hint{font-size:12.5px;font-weight:700;color:var(--accent)}
.combos{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.combo{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface2);border-radius:12px;padding:9px 11px;opacity:0;animation:rev .45s ease-out forwards;animation-delay:var(--d)}
.combo .cn{display:flex;flex-direction:column;gap:2px;min-width:0}
.combo b{font-size:13.5px}
.combo small{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.combo .pts{font-family:var(--font-display);font-weight:800;font-size:20px}
.combo.gold .pts{color:var(--good)}
.combo.curse .pts{color:var(--bad)}
.missed{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.missed div{display:flex;flex-direction:column;gap:2px}
.missed small{color:var(--muted);font-size:12px}
/* auction */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.topbar h2{font-size:20px;flex:1;min-width:0}
.ghost{background:transparent;border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:600;font-size:13.5px}
.ghost:disabled{opacity:.35;cursor:default}
.players{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pl{background:var(--surface);border-radius:16px;padding:12px;border-top:5px solid var(--c);display:flex;flex-direction:column;gap:8px;min-width:0;outline:3px solid transparent;transition:outline-color .2s}
.pl.turn{outline-color:var(--c)}
.pl-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-bud{font-family:var(--font-display);font-size:34px;font-weight:800;line-height:1}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--c);transition:width .35s}
.slots{display:flex;gap:5px}
.slot{flex:1;height:10px;border-radius:4px;background:var(--surface2)}
.slot.on{background:var(--c)}
.pl-foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.block{background:var(--surface);border-radius:22px;padding:18px 16px;display:flex;flex-direction:column;gap:14px;text-align:center}
.banner{border-radius:999px;padding:7px 14px;font-weight:700;font-size:13.5px;align-self:center;background:var(--c);color:var(--on);}
.item{font-family:var(--font-display);font-weight:800;font-size:34px;line-height:1.05;overflow-wrap:anywhere;animation:pop .35s ease-out;min-height:2.1em;display:flex;align-items:center;justify-content:center}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.stepper{display:flex;align-items:center;justify-content:center;gap:14px}
.step{width:52px;height:52px;border-radius:50%;border:0;background:var(--surface2);font-size:26px;font-weight:700}
.step:disabled{opacity:.3}
.price{font-family:var(--font-display);font-size:48px;font-weight:800;min-width:3.2ch}
.quick{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.quick button{border:2px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-weight:700}
.quick button.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.quick button:disabled{opacity:.3}
.assign{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:16px;padding:14px 10px;font-weight:800;font-size:16px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;min-height:60px}
.btn small{font-weight:500;font-size:11.5px;opacity:.8}
.btn:disabled{opacity:.3;cursor:default}
.b0{background:var(--p1);color:var(--on-p1)}.b1{background:var(--p2);color:var(--on-p2)}
.btn.skip{background:transparent;border:2px dashed var(--muted);color:var(--ink);flex-direction:row;justify-content:center;gap:8px;width:100%}
.progress{font-size:12.5px;color:var(--muted)}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team{background:var(--surface);border-radius:16px;padding:12px;min-width:0}
.team h3{font-size:15px;margin-bottom:8px;display:flex;align-items:center}
.team ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.team li{display:flex;justify-content:space-between;gap:6px;font-size:13px;min-width:0}
.team li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team li.empty{color:var(--muted)}

/* result */
.verdict{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.verdict h1{font-size:40px;font-weight:800;line-height:1}
.crown{font-family:var(--font-display);font-weight:800;border-radius:999px;padding:6px 16px;background:var(--c);color:var(--on)}
.rteams{display:flex;flex-direction:column;gap:12px}
.rteam{background:var(--surface);border-radius:18px;padding:14px;border-left:6px solid var(--c)}
.rteam-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.rteam-head h3{font-size:20px}
.rteam-score{font-family:var(--font-display);font-size:30px;font-weight:800;color:var(--c)}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line);opacity:0;animation:rev .45s ease-out forwards;animation-delay:var(--d)}
@keyframes rev{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.row b{font-weight:700;overflow-wrap:anywhere}
.stars{color:var(--p2);letter-spacing:1px;white-space:nowrap;text-align:right}
.row small{color:var(--muted)}
.sum{font-size:12.5px;color:var(--muted);margin-top:6px}
.badges{display:grid;gap:10px}
.badge{background:var(--surface2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.badge b{font-family:var(--font-display);font-size:16px}
.cta{display:flex;flex-direction:column;gap:10px}
.btn.main{background:var(--accent);color:var(--on-accent);flex-direction:row;justify-content:center;width:100%}
.btn.alt{background:var(--surface2);color:var(--ink);flex-direction:row;justify-content:center;width:100%}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:60;animation:pop .25s ease-out;max-width:90vw;text-align:center}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
  .row,.combo{opacity:1}
}
</style>

function undo(){
  if(!S.hist.length)return;
  var o=JSON.parse(S.hist.pop());S.pl=o.pl;S.i=o.i;S.turn=o.turn;S.price=o.price;render();
}
function advance(){
  S.turn=1-S.turn;
  if(full(S.turn))S.turn=1-S.turn;
  S.price=Math.max(1,Math.min(S.price,maxBoth()));
  if((full(0)&&full(1))||S.i>=S.deck.length){finish();return;}
  render();
}
function assign(p){
  var it=S.deck[S.i];if(!it||full(p)||S.price<1||S.price>maxP(p))return;
  snap();
  var before=comboList(p).length;
  S.pl[p].picks.push({name:it.name,stars:it.stars,price:S.price});
  S.pl[p].budget-=S.price;
  var after=comboList(p),msg=it.name+' a '+nm(p)+' per €'+S.price;
  if(after.length>before){var nw=after.slice(before);msg+=' · '+nw.map(function(c){return (c.bonus<0?'Maledizione: ':'Combo d\'oro: ')+c.name+' ('+(c.bonus>0?'+':'')+c.bonus+')';}).join(', ');}
  toast(msg,after.length>before?3200:1700);
  S.i++;S.price=1;advance();
}
function skip(){
  var q=S.pl[S.turn];if(q.skips<1||full(S.turn))return;
  snap();q.skips--;S.i++;S.price=1;toast('Skip di '+nm(S.turn));advance();
}
function comboList(p,catId){
  var have={};S.pl[p].picks.forEach(function(k){have[k.name]=1;});
  return (COMBOS[catId||S.cat]||[]).filter(function(c){return c[2].every(function(n){return have[n];});})
    .map(function(c){return {name:c[0],bonus:c[1],items:c[2]};});
}
function score(p){
  var q=S.pl[p];var fame=q.picks.reduce(function(a,b){return a+b.stars;},0);
  var cb=comboList(p);var bonus=cb.reduce(function(a,b){return a+b.bonus;},0);
  return {fame:fame,combos:cb,bonus:bonus,total:fame+bonus};
}
function comboHint(id){
  var cs=COMBOS[id]||[];var g=cs.filter(function(c){return c[1]>0;}).length,b=cs.length-g;
  return g+' combo d\'oro nascoste'+(b?' e '+b+(b===1?' maledizione':' maledizioni'):'');
}
function finish(){
  var a=score(0),b=score(1);
  var win=a.total===b.total?-1:(a.total>b.total?0:1);
  var all=[];
  [0,1].forEach(function(p){S.pl[p].picks.forEach(function(k){all.push({p:p,k:k});});});
  var deal=all.slice().sort(function(x,y){return (y.k.stars/y.k.price)-(x.k.stars/x.k.price)||y.k.stars-x.k.stars;})[0];
  var flop=all.slice().sort(function(x,y){return (x.k.stars/x.k.price)-(y.k.stars/y.k.price)||y.k.price-x.k.price;})[0];
  S.res={a:a,b:b,win:win,deal:deal,flop:flop};
  var prev=S.night.done[S.cat];
  if(prev&&prev.win>=0)S.night.wins[prev.win]--;
  S.night.done[S.cat]={win:win};
  if(win>=0)S.night.wins[win]++;
  save();S.screen='result';render();window.scrollTo(0,0);
  confetti(win);
}

/* views */
function homeView(){
  var w=S.night.wins,n=Object.keys(S.night.done).length;
  var tiles=CATS.map(function(c,i){
    var d=S.night.done[c.id];
    var tag=d?(d.win>=0?'<span class="win"><i class="d'+d.win+'"></i>'+esc(nm(d.win))+'</span>':'<span class="win">Pari</span>'):'';
    return '<button class="tile" data-act="start" data-id="'+c.id+'" style="--h:'+c.h+'">'+
      '<span><span class="tile-name">'+esc(c.name)+'</span></span>'+
      '<span class="tile-scen">'+esc(c.scen)+'</span>'+
      '<span class="tile-meta"><span>'+c.items.length+' voci</span>'+tag+'</span></button>';
  }).join('');
  return '<div class="hero"><div class="eyebrow">Draft all\'asta</div><h1>Draftino?</h1>'+
    '<p>Scegli uno scenario, battete le voci una alla volta e costruite la squadra migliore.</p></div>'+
    '<div class="rules"><span class="chip">€20 a testa</span><span class="chip">5 scelte</span><span class="chip">2 skip</span><span class="chip">min. €1 a voce</span><span class="chip">combo d\'oro</span></div>'+
    '<div class="card names"><label><span class="eyebrow"><i class="dot d0"></i>Giocatore 1</span><input id="n0" value="'+esc(S.names[0])+'" maxlength="18" autocomplete="off"></label>'+
    '<label><span class="eyebrow"><i class="dot d1"></i>Giocatore 2</span><input id="n1" value="'+esc(S.names[1])+'" maxlength="18" autocomplete="off"></label></div>'+
    '<div class="card night"><div><div class="eyebrow">Classifica della serata</div><div class="progress">'+n+' di '+CATS.length+' scenari giocati</div></div>'+
    '<div class="score num"><span class="a">'+w[0]+'</span><span>-</span><span class="b">'+w[1]+'</span></div></div>'+
    '<div class="grid"><button class="tile mys" data-act="mystery"><span class="tile-name">Categoria misteriosa</span><span class="tile-scen">Lo scenario lo sceglie il caso, tra tutti quelli che non avete ancora giocato.</span><span class="tile-meta"><span>?</span><span>'+CATS.length+' scenari in gioco</span></span></button>'+tiles+'</div>';
}
function auctionView(){
  var c=BY[S.cat],it=S.deck[S.i],t=S.turn;
  var mx=[maxP(0),maxP(1)],mb=maxBoth();
  var panels=[0,1].map(function(p){
    var q=S.pl[p];
    var slots='';for(var k=0;k<SLOTS;k++)slots+='<span class="slot'+(k<q.picks.length?' on':'')+'"></span>';
    return '<div class="pl'+(t===p?' turn':'')+'" style="--c:var(--p'+(p+1)+')">'+
      '<div class="pl-name">'+esc(nm(p))+'</div>'+
      '<div class="pl-bud num">€'+q.budget+'</div>'+
      '<div class="bar"><i style="width:'+(q.budget/START*100)+'%"></i></div>'+
      '<div class="slots">'+slots+'</div>'+
      '<div class="pl-foot"><span>'+q.picks.length+'/'+SLOTS+' scelte</span><span>Skip '+q.skips+'</span></div></div>';
  }).join('');
  var chips=[1,2,3,5,8].map(function(v){
    return '<button data-act="price" data-v="'+v+'" class="'+(S.price===v?'sel':'')+'"'+(v>mb?' disabled':'')+'>€'+v+'</button>';
  }).join('');
  var teams=[0,1].map(function(p){
    var q=S.pl[p],li='';
    for(var k=0;k<SLOTS;k++){
      var x=q.picks[k];
      li+=x?'<li><span>'+esc(x.name)+'</span><span class="num">€'+x.price+'</span></li>':'<li class="empty"><span>Libero</span><span>-</span></li>';
    }
    return '<div class="team"><h3><i class="dot d'+p+'"></i>'+esc(nm(p))+'</h3><ol>'+li+'</ol></div>';
  }).join('');
  var sk=S.pl[t].skips;
  return '<div class="topbar"><button class="ghost" data-act="home">Esci</button><h2>'+esc(c.name)+'</h2>'+
    '<button class="ghost" data-act="undo"'+(S.hist.length?'':' disabled')+'>Annulla</button></div>'+
    '<div class="players">'+panels+'</div>'+
    '<div class="block" style="--c:var(--p'+(t+1)+');--on:var(--on-p'+(t+1)+')">'+
      '<div class="progress">'+esc(c.scen)+' · voce '+(S.i+1)+' di '+S.deck.length+'</div>'+
      '<div class="hint">'+esc(comboHint(S.cat))+'</div>'+
      '<div class="banner">Tocca a '+esc(nm(t))+': punta o skippa</div>'+
      '<div class="item" id="it'+S.i+'">'+esc(it.name)+'</div>'+
      '<div class="stepper"><button class="step" data-act="minus" aria-label="Meno 1 euro"'+(S.price<=1?' disabled':'')+'>−</button>'+
        '<div class="price num">€'+S.price+'</div>'+
        '<button class="step" data-act="plus" aria-label="Più 1 euro"'+(S.price>=mb?' disabled':'')+'>+</button></div>'+
      '<div class="quick">'+chips+'</div>'+
      '<div class="assign">'+
        '<button class="btn b0" data-act="assign" data-p="0"'+((full(0)||S.price>mx[0])?' disabled':'')+'>Assegna a '+esc(nm(0))+'<small>'+(full(0)?'squadra piena':'max €'+mx[0])+'</small></button>'+
        '<button class="btn b1" data-act="assign" data-p="1"'+((full(1)||S.price>mx[1])?' disabled':'')+'>Assegna a '+esc(nm(1))+'<small>'+(full(1)?'squadra piena':'max €'+mx[1])+'</small></button>'+
      '</div>'+
      '<button class="btn skip" data-act="skip"'+(sk<1?' disabled':'')+'>Skip di '+esc(nm(t))+'<small>'+(sk<1?'finiti':sk+' rimasti')+'</small></button>'+
    '</div>'+
    '<div class="teams">'+teams+'</div>';
}
function resultView(){
  var c=BY[S.cat],r=S.res;
  var w=r.win;
  var head=w<0?'<div class="crown" style="--c:var(--surface2);--on:var(--ink)">Pareggio</div>':
    '<div class="crown" style="--c:var(--p'+(w+1)+');--on:var(--on-p'+(w+1)+')">Vince '+esc(nm(w))+'</div>';
  var d=0;
  var teams=[0,1].map(function(p){
    var sc=p===0?r.a:r.b;
    var rows=S.pl[p].picks.map(function(k){
      var del=(d++*0.22).toFixed(2)+'s';
      return '<div class="row" style="--d:'+del+'"><b>'+esc(k.name)+'</b><span class="stars">'+stars(k.stars)+'</span><small class="num">pagato €'+k.price+'</small><small></small></div>';
    }).join('');
    var cb=sc.combos.map(function(c){
      var del=(d++*0.22).toFixed(2)+'s';
      return '<div class="combo '+(c.bonus<0?'curse':'gold')+'" style="--d:'+del+'"><span class="cn"><b>'+(c.bonus<0?'Maledizione: ':'Combo d\'oro: ')+esc(c.name)+'</b><small>'+esc(c.items.join(' + '))+'</small></span><span class="pts num">'+(c.bonus>0?'+':'')+c.bonus+'</span></div>';
    }).join('');
    return '<div class="rteam" style="--c:var(--p'+(p+1)+')"><div class="rteam-head"><h3>'+esc(nm(p))+'</h3><div class="rteam-score num">'+sc.total+'</div></div>'+
      rows+(cb?'<div class="combos">'+cb+'</div>':'')+'<div class="sum num">Voto del banco '+sc.fame+(sc.combos.length?(sc.bonus<0?' − ':' + ')+'combo '+Math.abs(sc.bonus):'')+'</div></div>';
  }).join('');
  var badges='';
  if(r.deal)badges+='<div class="badge"><div class="eyebrow">Affare della serata</div><b>'+esc(r.deal.k.name)+'</b><span>'+esc(nm(r.deal.p))+' lo prende a €'+r.deal.k.price+' ('+r.deal.k.stars+' stelle)</span></div>';
  if(r.flop&&(!r.deal||r.flop!==r.deal))badges+='<div class="badge"><div class="eyebrow">Spesa azzardata</div><b>'+esc(r.flop.k.name)+'</b><span>'+esc(nm(r.flop.p))+' paga €'+r.flop.k.price+' per '+r.flop.k.stars+' stelle</span></div>';
  var wn=S.night.wins;
  var missed=(COMBOS[S.cat]||[]).filter(function(c){return c[1]>0&&!comboList(0).concat(comboList(1)).some(function(x){return x.name===c[0];});}).slice(0,4);
  var miss=missed.length?'<div class="card"><div class="eyebrow">Combo d\'oro sfuggite</div><div class="missed">'+missed.map(function(c){return '<div><b>'+esc(c[0])+' (+'+c[1]+')</b><small>'+esc(c[2].join(' + '))+'</small></div>';}).join('')+'</div></div>':'';
  return '<div class="verdict"><div class="eyebrow">'+esc(c.name)+'</div><h1>Verdetto</h1>'+head+'</div>'+
    '<div class="rteams">'+teams+'</div>'+
    '<div class="badges">'+badges+'</div>'+miss+
    '<div class="card night"><div class="eyebrow">Classifica della serata</div><div class="score num"><span class="a">'+wn[0]+'</span><span>-</span><span class="b">'+wn[1]+'</span></div></div>'+
    '<div class="cta"><button class="btn main" data-act="home">Prossimo scenario</button><button class="btn alt" data-act="again">Rigioca questo scenario</button></div>';
}
function render(){
  app.innerHTML=S.screen==='home'?homeView():S.screen==='auction'?auctionView():resultView();
}

/* extras */
function toast(msg,ms){
  var o=document.querySelector('.toast');if(o)o.remove();
  var t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);
  setTimeout(function(){t.remove();},ms||1700);
}
function confetti(win){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var cv=document.getElementById('confetti');if(!cv||!cv.getContext)return;
  var cs=getComputedStyle(document.documentElement);
  var cols=[cs.getPropertyValue('--p1'),cs.getPropertyValue('--p2'),cs.getPropertyValue('--accent'),cs.getPropertyValue('--good')];
  if(win>=0)cols=[cs.getPropertyValue(win===0?'--p1':'--p2'),cs.getPropertyValue('--accent'),cs.getPropertyValue('--good'),cs.getPropertyValue(win===0?'--p1':'--p2')];
  cv.hidden=false;cv.width=innerWidth;cv.height=innerHeight;
  var x=cv.getContext('2d'),P=[];
  for(var i=0;i<110;i++)P.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,s:5+Math.random()*6,c:cols[i%cols.length].trim()||'#fff',r:Math.random()*6});
  var f=0;
  (function tick(){
    x.clearRect(0,0,cv.width,cv.height);
    P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.r+=.15;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);x.restore();});
    if(++f<150)requestAnimationFrame(tick);else{x.clearRect(0,0,cv.width,cv.height);cv.hidden=true;}
  })();
}

function mystery(){
  var pool=CATS.filter(function(c){return !S.night.done[c.id];});
  if(!pool.length)pool=CATS;
  var pick=pool[Math.floor(Math.random()*pool.length)];
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var ov=document.createElement('div');ov.className='shuf';
  ov.innerHTML='<div class="eyebrow">Categoria misteriosa</div><div class="shuf-name" id="shufname">?</div>';
  document.body.appendChild(ov);
  var el=ov.querySelector('#shufname'),n=0,total=reduce?1:16;
  (function tick(){
    var c=n>=total?pick:CATS[Math.floor(Math.random()*CATS.length)];
    el.textContent=c.name;n++;
    if(n<=total)setTimeout(tick,60+n*14);
    else setTimeout(function(){ov.remove();start(pick.id);},650);
  })();
}

/* events */
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  var a=b.dataset.act;
  if(a==='start')start(b.dataset.id);
  else if(a==='home'){S.screen='home';render();window.scrollTo(0,0);}
  else if(a==='again')start(S.cat);
  else if(a==='mystery')mystery();
  else if(a==='undo')undo();
  else if(a==='skip')skip();
  else if(a==='assign')assign(+b.dataset.p);
  else if(a==='minus'){S.price=Math.max(1,S.price-1);render();}
  else if(a==='plus'){S.price=Math.min(maxBoth(),S.price+1);render();}
  else if(a==='price'){S.price=Math.min(+b.dataset.v,maxBoth());render();}
});
app.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='n0'||t.id==='n1'){S.names[t.id==='n0'?0:1]=t.value;save();}
});
render();
</script>
